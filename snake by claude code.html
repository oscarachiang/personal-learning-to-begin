<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇</title>
<style>
  :root{
    --bg: #0b0d12;
    --panel: #12151d;
    --line: #1e2430;
    --text: #e7ecf3;
    --dim: #7b8598;
    --snake-a: #4ade80;
    --snake-b: #22d3ee;
    --food: #fb7185;
    --accent: #4ade80;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1000px 600px at 50% -10%, #16202c 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100svh;
    padding: 16px;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
  }
  /* 板子是正方形，宽度同时受视口宽、高度和 560px 上限约束，保证 HUD 和操作提示不被裁掉 */
  .app{
    width: min(92vw, 560px, max(240px, calc(100vh - 170px)));
    display:flex; flex-direction:column; gap:14px;
  }
  @supports (height: 100svh){
    .app{ width: min(92vw, 560px, max(240px, calc(100svh - 170px))); }
  }

  .hud{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand h1{ margin:0; font-size:19px; letter-spacing:.14em; font-weight:700; }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .stats{ display:flex; gap:18px; }
  .stat{ text-align:right; }
  .stat .k{ font-size:10px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  .stat .v{ font-size:22px; font-weight:700; font-variant-numeric: tabular-nums; line-height:1.15; }
  .stat.best .v{ color:var(--dim); font-size:16px; }

  .stage{
    position:relative; width:100%; aspect-ratio:1/1;
    border-radius:18px;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow: 0 24px 60px -24px #000, inset 0 1px 0 #ffffff08;
    overflow:hidden;
    touch-action: none;
  }
  canvas{ display:block; width:100%; height:100%; }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; padding:24px;
    background: radial-gradient(120% 90% at 50% 40%, #0b0d12dd, #0b0d12f2);
    backdrop-filter: blur(6px);
    opacity:0; visibility:hidden; transition: opacity .18s ease, visibility .18s;
  }
  .overlay.show{ opacity:1; visibility:visible; }
  .overlay h2{ margin:0; font-size:30px; letter-spacing:.06em; }
  .overlay p{ margin:0; color:var(--dim); font-size:13px; line-height:1.7; }
  .overlay .score-big{ font-size:46px; font-weight:800; font-variant-numeric: tabular-nums; line-height:1; }
  .overlay .badge{
    font-size:11px; letter-spacing:.16em; color:#0b0d12; background:var(--accent);
    padding:4px 10px; border-radius:999px; font-weight:800;
  }

  .seg{ display:flex; gap:6px; padding:5px; background:#0b0d12; border:1px solid var(--line); border-radius:12px; }
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--dim);
    font:inherit; font-size:13px; padding:8px 16px; border-radius:8px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .seg button:hover{ color:var(--text); }
  .seg button[aria-pressed="true"]{ background:var(--accent); color:#0b0d12; font-weight:700; }

  .btn{
    appearance:none; border:0; cursor:pointer; font:inherit; font-weight:700; font-size:15px;
    padding:12px 30px; border-radius:12px; color:#0b0d12;
    background: linear-gradient(135deg, var(--snake-a), var(--snake-b));
    box-shadow: 0 10px 30px -10px #4ade8088;
    transition: transform .12s ease, filter .15s;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform: translateY(1px) scale(.99); }
  .btn.ghost{
    background:transparent; color:var(--dim); box-shadow:none;
    border:1px solid var(--line); font-weight:600; font-size:13px; padding:10px 20px;
  }
  .btn.ghost:hover{ color:var(--text); border-color:#2c3646; }

  .row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }

  .hint{ display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-size:12px; }
  kbd{
    font-family:inherit; font-size:11px; color:var(--text);
    background:#171c26; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:6px; padding:2px 6px; margin:0 1px;
  }
  .icon{
    appearance:none; background:#171c26; border:1px solid var(--line); color:var(--dim);
    width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; line-height:1;
  }
  .icon:hover{ color:var(--text); }
  @media (max-width: 420px){
    .stat .v{ font-size:18px; }
    .brand h1{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="brand"><span class="dot"></span><h1>贪吃蛇</h1></div>
    <div class="stats">
      <div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div>
      <div class="stat best"><div class="k">最高</div><div class="v" id="best">0</div></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="hint">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　<kbd>空格</kbd> 暂停</span>
    <button class="icon" id="mute" title="音效开关">♪</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const COLS = 20, ROWS = 20, START_LEN = 4, BEST_KEY = 'snake.best.v1';

  const DIFFICULTIES = {
    easy:   { label: '慢速', base: 175 },
    normal: { label: '标准', base: 140 },
    fast:   { label: '极速', base: 105 },
  };

  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const muteBtn = document.getElementById('mute');

  let cell = 24;
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  const S = {
    mode: 'menu',        // menu | play | paused | dead
    diff: 'normal',
    snake: [], prev: [],
    dir: { x: 1, y: 0 },
    queue: [],
    food: { x: 0, y: 0 },
    score: 0,
    acc: 0,
    particles: [],
    newBest: false,
    shake: 0,
    flash: 0,
    deathAt: 0,
    foodPulse: 0,
    sound: true,
  };

  // ---------- 声音 ----------
  let actx = null;
  function beep(freq, dur, type = 'sine', vol = 0.05) {
    if (!S.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0); o.stop(t0 + dur);
    } catch (_) { /* 音频不可用就静默 */ }
  }

  // ---------- 尺寸 ----------
  function resize() {
    const size = stage.clientWidth;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixels = Math.round(size * dpr);
    cvs.width = pixels;
    cvs.height = pixels;
    // 用实际设备像素反推缩放，保证 0..size 刚好铺满画布，不留半像素边缘
    const scale = pixels / size;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    cell = size / COLS;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- 游戏逻辑 ----------
  const interval = () => Math.max(62, DIFFICULTIES[S.diff].base - (S.snake.length - START_LEN) * 2.4);

  function spawnFood() {
    const taken = new Set(S.snake.map(s => s.y * COLS + s.x));
    const free = [];
    for (let i = 0; i < COLS * ROWS; i++) if (!taken.has(i)) free.push(i);
    const i = free[Math.floor(Math.random() * free.length)];
    S.food = { x: i % COLS, y: Math.floor(i / COLS) };
    S.foodPulse = 0;
  }

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    S.snake = [];
    for (let i = 0; i < START_LEN; i++) S.snake.push({ x: cx - i, y: cy });
    S.prev = S.snake.map(s => ({ ...s }));
    S.dir = { x: 1, y: 0 };
    S.queue = [];
    S.score = 0;
    S.acc = 0;
    S.particles = [];
    S.newBest = false;
    S.shake = 0;
    S.flash = 0;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function push(d) {
    const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
    if (d.x === -last.x && d.y === -last.y) return;  // 禁止 180° 掉头
    if (d.x === last.x && d.y === last.y) return;    // 重复方向忽略
    if (S.queue.length < 2) S.queue.push(d);
  }

  function hitsSelf(x, y, ignoreTail) {
    const n = S.snake.length - (ignoreTail ? 1 : 0);
    for (let i = 0; i < n; i++) if (S.snake[i].x === x && S.snake[i].y === y) return true;
    return false;
  }

  function step() {
    if (S.queue.length) S.dir = S.queue.shift();

    const head = S.snake[0];
    const nx = head.x + S.dir.x, ny = head.y + S.dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
    const eating = (nx === S.food.x && ny === S.food.y);
    if (hitsSelf(nx, ny, !eating)) return die();

    S.prev = S.snake.map(s => ({ ...s }));
    S.snake.unshift({ x: nx, y: ny });

    if (eating) {
      S.score += 10;
      scoreEl.textContent = S.score;
      burst(nx, ny);
      beep(660, 0.09, 'square', 0.045);
      setTimeout(() => beep(990, 0.08, 'square', 0.03), 55);
      if (S.score > best) {
        best = S.score;
        S.newBest = true;
        bestEl.textContent = best;
        localStorage.setItem(BEST_KEY, String(best));
      }
      spawnFood();
      S.shake = Math.min(S.shake + 2.5, 6);
    } else {
      S.snake.pop();
    }
  }

  function die() {
    S.mode = 'dead';
    S.deathAt = performance.now();
    S.acc = 0;
    S.shake = 14;
    S.flash = 1;
    beep(220, 0.22, 'sawtooth', 0.06);
    setTimeout(() => beep(120, 0.35, 'sawtooth', 0.05), 110);
    const h = S.snake[0];
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4;
      S.particles.push({
        x: h.x + 0.5, y: h.y + 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, size: 0.06 + Math.random() * 0.12, color: '#fb7185',
      });
    }
  }

  function burst(gx, gy) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 3;
      S.particles.push({
        x: gx + 0.5, y: gy + 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, size: 0.05 + Math.random() * 0.09,
        color: Math.random() < 0.5 ? '#fb7185' : '#fbbf24',
      });
    }
  }

  // ---------- 渲染 ----------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function bodyPoints(t) {
    const pts = [];
    for (let i = 0; i < S.snake.length; i++) {
      const cur = S.snake[i];
      const pv = S.prev[i] || cur;
      pts.push({
        x: (pv.x + (cur.x - pv.x) * t + 0.5) * cell,
        y: (pv.y + (cur.y - pv.y) * t + 0.5) * cell,
      });
    }
    return pts;
  }

  function drawGrid() {
    const w = COLS * cell;
    ctx.save();
    ctx.strokeStyle = '#ffffff08';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(Math.round(i * cell) + 0.5, 0);
      ctx.lineTo(Math.round(i * cell) + 0.5, w);
      ctx.moveTo(0, Math.round(i * cell) + 0.5);
      ctx.lineTo(w, Math.round(i * cell) + 0.5);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawFood(now) {
    const x = (S.food.x + 0.5) * cell;
    const y = (S.food.y + 0.5) * cell;
    const pulse = 1 + Math.sin(now / 260) * 0.07;

    ctx.save();
    ctx.shadowColor = 'rgba(251,113,133,.9)';
    ctx.shadowBlur = 22;
    const r = cell * 0.3 * pulse;
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffe4e9');
    g.addColorStop(0.45, '#fb7185');
    g.addColorStop(1, '#e11d48');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.clip();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(251,113,133,.28)';
    ctx.lineWidth = Math.max(1, cell * 0.05);
    ctx.beginPath();
    ctx.arc(x, y, cell * (0.42 + Math.sin(now / 260) * 0.06), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawSnake(t, now) {
    const pts = bodyPoints(t);
    if (!pts.length) return;
    const dead = S.mode === 'dead';
    const w = cell * 0.78;

    const head = pts[0], tail = pts[pts.length - 1];
    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    if (dead) {
      grad.addColorStop(0, '#f87171');
      grad.addColorStop(1, '#7f1d1d');
    } else {
      grad.addColorStop(0, '#86efac');
      grad.addColorStop(0.35, '#4ade80');
      grad.addColorStop(0.75, '#22d3ee');
      grad.addColorStop(1, '#0ea5e9');
    }

    const path = () => {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else if (i === pts.length - 1 && pts.length > 2) {
          const prev = pts[i - 1];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + p.x) / 2, (prev.y + p.y) / 2);
        } else ctx.lineTo(p.x, p.y);
      }
    };

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 外发光
    ctx.globalAlpha = dead ? 0.28 : 0.35;
    ctx.strokeStyle = grad;
    ctx.lineWidth = w + cell * 0.36;
    ctx.filter = 'blur(4px)';
    path(); ctx.stroke();
    ctx.filter = 'none';

    // 主体
    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = w;
    path(); ctx.stroke();

    // 高光
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, w * 0.16);
    ctx.save();
    ctx.translate(0, -w * 0.2);
    path(); ctx.stroke();
    ctx.restore();
    ctx.restore();

    // 头
    const h = pts[0];
    ctx.save();
    ctx.fillStyle = dead ? '#dc2626' : '#4ade80';
    ctx.shadowColor = dead ? 'rgba(239,68,68,.8)' : 'rgba(74,222,128,.85)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(h.x, h.y, w * 0.54, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 眼睛
    const d = S.dir, px = -d.y, py = d.x;
    const ex = d.x * cell * 0.14, ey = d.y * cell * 0.14;
    const ox = px * cell * 0.19, oy = py * cell * 0.19;
    for (const sign of [1, -1]) {
      const cx = h.x + ex + ox * sign, cy = h.y + ey + oy * sign;
      ctx.fillStyle = '#08131a';
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.2, 0, Math.PI * 2);
      ctx.fill();
      if (!dead) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx + d.x * w * 0.07, cy + d.y * w * 0.07, w * 0.075, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawParticles(dt) {
    for (let i = S.particles.length - 1; i >= 0; i--) {
      const p = S.particles[i];
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vx *= 0.94; p.vy *= 0.94; p.vy += 0.045 * dt * 0.06;
      p.life -= dt * 0.0016;
      if (p.life <= 0) { S.particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x * cell, p.y * cell, p.size * cell, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(now, dt) {
    const size = COLS * cell;
    ctx.clearRect(0, 0, size, size);

    ctx.save();
    if (S.shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    }

    drawGrid();
    drawFood(now);
    drawParticles(dt);

    const t = S.mode === 'play' ? clamp(S.acc / interval(), 0, 1) : 1;
    drawSnake(t, now);

    ctx.restore();

    if (S.flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = S.flash * 0.35;
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(0, 0, size, size);
      ctx.restore();
    }
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(now - last, 100);
    last = now;

    if (S.mode === 'play') {
      S.acc += dt;
      let iv = interval();
      while (S.acc >= iv) {
        S.acc -= iv;
        step();
        if (S.mode !== 'play') { S.acc = 0; break; }
        iv = interval();
      }
    } else {
      S.acc = 0;
    }

    S.shake *= Math.pow(0.9, dt / 16.67);
    if (S.shake < 0.1) S.shake = 0;
    S.flash *= Math.pow(0.88, dt / 16.67);
    if (S.flash < 0.01) S.flash = 0;

    if (S.mode === 'dead' && !overlay.classList.contains('show') && now - S.deathAt > 620) {
      showOverlay();
    }

    draw(now, dt);
    requestAnimationFrame(loop);
  }

  // ---------- 界面 ----------
  function showOverlay() {
    if (S.mode === 'menu') {
      overlay.innerHTML = `
        <h2>贪吃蛇</h2>
        <p>吃果子变长，别撞墙，也别咬到自己</p>
        <div class="seg" role="group" aria-label="难度">
          ${Object.entries(DIFFICULTIES).map(([k, v]) =>
            `<button data-diff="${k}" aria-pressed="${k === S.diff}">${v.label}</button>`).join('')}
        </div>
        <button class="btn" data-act="start">开始游戏</button>
        <p style="font-size:12px">方向键 / WASD 移动　空格暂停</p>`;
    } else if (S.mode === 'paused') {
      overlay.innerHTML = `
        <h2>已暂停</h2>
        <p>当前分数 ${S.score}</p>
        <button class="btn" data-act="resume">继续</button>
        <button class="btn ghost" data-act="menu">重新开始</button>`;
    } else if (S.mode === 'dead') {
      overlay.innerHTML = `
        ${S.newBest ? '<div class="badge">新纪录</div>' : '<h2>游戏结束</h2>'}
        <div class="score-big">${S.score}</div>
        <p>长度 ${S.snake.length}　最高分 ${best}</p>
        <button class="btn" data-act="restart">再来一局</button>
        <button class="btn ghost" data-act="menu">换个难度</button>`;
    }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function startGame() {
    reset();
    S.mode = 'play';
    hideOverlay();
    beep(520, 0.08, 'sine', 0.04);
  }

  function togglePause() {
    if (S.mode === 'play') {
      S.mode = 'paused';
      showOverlay();
    } else if (S.mode === 'paused') {
      S.mode = 'play';
      hideOverlay();
    }
  }

  overlay.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act], [data-diff]');
    if (!btn) return;
    if (btn.dataset.diff) {
      S.diff = btn.dataset.diff;
      overlay.querySelectorAll('[data-diff]').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.diff === S.diff)));
      beep(700, 0.05, 'sine', 0.03);
      return;
    }
    switch (btn.dataset.act) {
      case 'start':
      case 'restart':
        startGame(); break;
      case 'resume':
        togglePause(); break;
      case 'menu':
        S.mode = 'menu';
        reset();
        showOverlay(); break;
    }
  });

  muteBtn.addEventListener('click', () => {
    S.sound = !S.sound;
    muteBtn.textContent = S.sound ? '♪' : '✕';
    muteBtn.style.color = S.sound ? '' : 'var(--dim)';
    if (S.sound) beep(600, 0.06, 'sine', 0.04);
  });

  // ---------- 输入 ----------
  const KEYMAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (KEYMAP[k]) {
      e.preventDefault();
      if (S.mode === 'play') push(KEYMAP[k]);
      else if (S.mode === 'paused') { togglePause(); push(KEYMAP[k]); }
      return;
    }
    if (k === ' ') {
      e.preventDefault();
      if (S.mode === 'play' || S.mode === 'paused') togglePause();
      else startGame();
      return;
    }
    if (k === 'Enter') {
      e.preventDefault();
      if (S.mode !== 'play') startGame();
      return;
    }
    if (k === 'm') { muteBtn.click(); }
  }, { passive: false });

  // 滑动
  let touch = null;
  stage.addEventListener('pointerdown', (e) => {
    if (S.mode === 'menu' || S.mode === 'dead') return;
    touch = { x: e.clientX, y: e.clientY, moved: false };
  });
  stage.addEventListener('pointermove', (e) => {
    if (!touch) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    if (Math.hypot(dx, dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) push({ x: Math.sign(dx), y: 0 });
    else push({ x: 0, y: Math.sign(dy) });
    touch = { x: e.clientX, y: e.clientY, moved: true };
  });
  stage.addEventListener('pointerup', () => { touch = null; });
  stage.addEventListener('pointercancel', () => { touch = null; });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.mode === 'play') togglePause();
  });

  // ---------- 启动 ----------
  reset();
  showOverlay();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
